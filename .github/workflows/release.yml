# main -> build -> scan image -> push by digest -> sign + attest -> deploy GKE dev
# -> open a GitOps PR that promotes the digest to the hospital "canary" site.
name: release

on:
  push:
    branches: [main]
    paths: ["app/**", "helm/**"]

permissions:
  contents: write
  id-token: write          # OIDC -> GCP Workload Identity Federation (no JSON keys)
  pull-requests: write
  security-events: write

env:
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/services/tray-tracker

jobs:
  build-scan-push:
    # Skip cleanly until GCP is provisioned and repo variables are set
    # (Settings -> Secrets and variables -> Actions -> Variables).
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build --build-arg APP_VERSION=$TAG -t $IMAGE:$TAG app

      # Block the release on HIGH/CRITICAL CVEs that have a fix available.
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scan-type: image
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif

      # Findings land in GitHub Security tab -> tracked to closure.
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scan-type: image
          format: cyclonedx
          output: sbom.cdx.json

      - id: push
        name: Push (immutable tag) and capture digest
        run: |
          docker push $IMAGE:$TAG
          DIGEST=$(gcloud artifacts docker images describe $IMAGE:$TAG --format='value(image_summary.digest)')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Binary Authorization attestation (KMS-signed)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="$IMAGE@${{ steps.push.outputs.digest }}" \
            --attestor="${{ vars.BINAUTHZ_ATTESTOR }}" \
            --keyversion="${{ vars.BINAUTHZ_KEY_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  deploy-gke-dev:
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: hep-dev-gke
          location: ${{ env.REGION }}
      - uses: azure/setup-helm@v4
      - name: Helm upgrade (atomic = auto-rollback on failed rollout)
        run: |
          helm upgrade --install tray-tracker helm/tray-tracker \
            --namespace tray-tracker --create-namespace \
            --set image.repository=$IMAGE \
            --set image.digest=${{ needs.build-scan-push.outputs.digest }} \
            --set serviceAccount.gcpServiceAccount=${{ vars.APP_GSA }} \
            --atomic --timeout 5m --wait
      - name: Smoke test
        run: kubectl -n tray-tracker rollout status deploy/tray-tracker

  promote-edge-canary:
    # Hospitals pull, we never push: CI only edits the GitOps repo; ArgoCD on
    # each site reconciles over an outbound-only connection.
    needs: [build-scan-push, deploy-gke-dev]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump canary site digest
        run: |
          yq -i '.image.digest = "${{ needs.build-scan-push.outputs.digest }}"' edge/sites/canary/values.yaml
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/canary-${{ github.sha }}
          title: "Promote tray-tracker ${{ github.sha }} to canary hospital site"
          body: |
            Image digest: `${{ needs.build-scan-push.outputs.digest }}`
            Scans: Semgrep ✅ Trivy (deps/config/image) ✅  Attested ✅
            Merge = ArgoCD rolls the canary site. After 24h healthy, promote to the `general` wave.
          labels: promotion, edge
